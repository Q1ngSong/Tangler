<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Tangler</title>
  <desc id="desc">A focused window resizes and moves to the left half of the desktop while Notes becomes visible on the right. Illustrated walkthrough, not a screen recording.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#e4edfb"/><stop offset=".5" stop-color="#c2d9f3"/><stop offset="1" stop-color="#9b9edc"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f5ff"/><stop offset=".48" stop-color="#d5d9fb"/><stop offset="1" stop-color="#8296d4"/></linearGradient>
    <linearGradient id="fold" x2="1" y2="1"><stop stop-color="#b8cbf3"/><stop offset=".65" stop-color="#a0d7ef"/><stop offset="1" stop-color="#789dcf"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".91"/><stop offset="1" stop-color="#f5f8ff" stop-opacity=".82"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".67"/><stop offset="1" stop-color="#eef3ff" stop-opacity=".32"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#33477f" flood-opacity=".15"/></filter>
    <clipPath id="canvas"><rect width="1120" height="620" rx="28"/></clipPath>
    <symbol id="cursor" viewBox="0 0 24 30"><path d="M2 2L20 17L12 18L8 26Z" fill="#24354c" stroke="white" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .focused { transform:translate(48px,150px); animation:place 10s ease-in-out infinite; }
    .resizing-frame { width:484px; animation:resize 10s ease-in-out infinite; }
    .companion { animation:reveal 10s ease-in-out infinite; }
    .snap-outline { opacity:0; animation:target 10s ease-in-out infinite; }
    @keyframes place { 0%,18%,100% { transform:translate(266px,161px); } 34%,82% { transform:translate(48px,150px); } }
    @keyframes resize { 0%,18%,100% { width:590px; } 34%,82% { width:484px; } }
    @keyframes reveal { 0%,22%,100% { opacity:0; transform:translateX(18px); } 40%,82% { opacity:1; transform:translateX(0); } }
    @keyframes target { 0%,16%,40%,100% { opacity:0; } 22%,31% { opacity:.75; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pointer { display:none; } }
  </style>
  <g clip-path="url(#canvas)">
    <rect width="1120" height="620" fill="url(#sky)"/>
      <path d="M-190 596C130 642 468 122 1260 210L1300 680H-190Z" fill="url(#ribbon)" stroke="#edf7ff" stroke-width="2"/>
      <path d="M-110 637C244 443 746 776 1217 191L1290 690H-110Z" fill="url(#fold)" stroke="#f3f5ff" stroke-opacity=".8" stroke-width="1.6"/>
      <path d="M-190 590C130 636 468 116 1260 204" fill="none" stroke="#ffffff" stroke-opacity=".24" stroke-width="5"/>
    <text x="48" y="58" font-size="31" fill="#25364e" font-weight="650" >Tangler</text>
    <text x="48" y="90" font-size="18" fill="#61718b" font-weight="400" >A place for every window.</text>
    <defs><clipPath id="resizing-content"><rect class="resizing-frame" width="484" height="300" rx="16"/></clipPath></defs>
      <g transform="translate(578 150)"><g class="companion" filter="url(#shadow)"><rect x="0" y="0" width="484" height="300" rx="16" fill="url(#window)" stroke="#ffffff" stroke-width="1.8"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#60708b" font-weight="500" >Notes</text><path d="M1 44H483" stroke="#bac9e1" stroke-opacity=".55"/><text x="28" y="84" font-size="24" fill="#25364e" font-weight="600" >Room for the next idea</text><text x="28" y="111" font-size="14" fill="#6b7890" font-weight="400" >A few things worth keeping together.</text><rect x="28" y="137" width="296" height="6" rx="3" fill="#bac9de" /><rect x="28" y="157" width="348" height="6" rx="3" fill="#bac9de" /><rect x="28" y="177" width="254" height="6" rx="3" fill="#bac9de" /><rect x="28" y="215" width="6" height="46" rx="3" fill="#448cee" /><text x="48" y="234" font-size="17" fill="#3c5c89" font-weight="500" >One desktop. A clearer view.</text><text x="48" y="257" font-size="14" fill="#78869d" font-weight="400" >Keep the next step in sight.</text></g></g><g class="focused" filter="url(#shadow)"><rect x="0" y="0" width="484" height="300" rx="16" fill="url(#window)" class="resizing-frame" stroke="white" stroke-width="1.8"/><g clip-path="url(#resizing-content)"><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#60708b" font-weight="500" >Browser</text><path d="M0 44H650" stroke="#bac9e1" stroke-opacity=".55"/><text x="28" y="84" font-size="24" fill="#25364e" font-weight="600" >A little more space</text><text x="28" y="111" font-size="14" fill="#6b7890" font-weight="400" >A few things worth keeping together.</text><rect x="28" y="137" width="296" height="6" rx="3" fill="#bac9de" /><rect x="28" y="157" width="348" height="6" rx="3" fill="#bac9de" /><rect x="28" y="177" width="254" height="6" rx="3" fill="#bac9de" /><rect x="28" y="215" width="6" height="46" rx="3" fill="#448cee" /><text x="48" y="234" font-size="17" fill="#3c5c89" font-weight="500" >One desktop. A clearer view.</text><text x="48" y="257" font-size="14" fill="#78869d" font-weight="400" >Keep the next step in sight.</text></g></g><rect x="43" y="135" width="510" height="330" rx="24" fill="none" class="snap-outline" stroke="#247eff" stroke-width="2"/><g transform="translate(48 512)"><rect x="0" y="0" width="134" height="46" rx="10" fill="#f8fbff" stroke="#ffffff" stroke-width="1.5"/><text x="67.0" y="30" font-size="21" fill="#25364e" font-weight="500" text-anchor="middle">right ⌘</text><rect x="143" y="0" width="52" height="46" rx="10" fill="#f8fbff" stroke="#ffffff" stroke-width="1.5"/><text x="169.0" y="30" font-size="21" fill="#25364e" font-weight="500" text-anchor="middle">←</text><text x="227" y="30" font-size="18" fill="#344e73" font-weight="500" >Hold the leader. Place the window.</text></g>
    <text x="1072" y="588" font-size="11" fill="#526886" font-weight="500" text-anchor="end" letter-spacing="1.4">TANGLER  /  ILLUSTRATED WALKTHROUGH</text>
  </g>
</svg>
