<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Your workspace, ready again.</title>
  <desc id="desc">Opening the Design workspace restores the browser and notes tab group, Files, and Terminal in their saved positions. Illustrated walkthrough, not a screen recording.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#e4edfb"/><stop offset=".5" stop-color="#c2d9f3"/><stop offset="1" stop-color="#9b9edc"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f5ff"/><stop offset=".48" stop-color="#d5d9fb"/><stop offset="1" stop-color="#8296d4"/></linearGradient>
    <linearGradient id="fold" x2="1" y2="1"><stop stop-color="#b8cbf3"/><stop offset=".65" stop-color="#a0d7ef"/><stop offset="1" stop-color="#789dcf"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".91"/><stop offset="1" stop-color="#f5f8ff" stop-opacity=".82"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".67"/><stop offset="1" stop-color="#eef3ff" stop-opacity=".32"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#33477f" flood-opacity=".15"/></filter>
    <clipPath id="canvas"><rect width="1120" height="620" rx="28"/></clipPath>
    <symbol id="cursor" viewBox="0 0 24 30"><path d="M2 2L20 17L12 18L8 26Z" fill="#24354c" stroke="white" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .restore-main { animation:restore-main 12s ease-in-out infinite; }
    .restore-side { animation:restore-side 12s ease-in-out infinite; }
    .restore-last { animation:restore-last 12s ease-in-out infinite; }
    .open-path { animation:open 12s ease-in-out infinite; }
    @keyframes restore-main { 0%,15%,100% { opacity:0; transform:translateY(18px); } 28%,88% { opacity:1; transform:translateY(0); } }
    @keyframes restore-side { 0%,23%,100% { opacity:0; transform:translateY(18px); } 36%,88% { opacity:1; transform:translateY(0); } }
    @keyframes restore-last { 0%,31%,100% { opacity:0; transform:translateY(18px); } 44%,88% { opacity:1; transform:translateY(0); } }
    @keyframes open { 0%,15%,100% { opacity:.2; } 24%,80% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pointer { display:none; } }
  </style>
  <g clip-path="url(#canvas)">
    <rect width="1120" height="620" fill="url(#sky)"/>
      <path d="M-190 596C130 642 468 122 1260 210L1300 680H-190Z" fill="url(#ribbon)" stroke="#edf7ff" stroke-width="2"/>
      <path d="M-110 637C244 443 746 776 1217 191L1290 690H-110Z" fill="url(#fold)" stroke="#f3f5ff" stroke-opacity=".8" stroke-width="1.6"/>
      <path d="M-190 590C130 636 468 116 1260 204" fill="none" stroke="#ffffff" stroke-opacity=".24" stroke-width="5"/>
    <text x="48" y="58" font-size="31" fill="#25364e" font-weight="650" >Your workspace, ready again.</text>
    <text x="48" y="90" font-size="18" fill="#61718b" font-weight="400" >Reopen a saved desktop with its windows and tab groups.</text>
    <g transform="translate(48 160)"><rect x="0" y="0" width="258" height="288" rx="20" fill="url(#glass)" stroke="white" stroke-width="1.5"/><text x="22" y="35" font-size="12" fill="#637898" font-weight="600" letter-spacing="1.5">WORKSPACES</text><rect x="14" y="58" width="230" height="129" rx="13" fill="#f4f8ff" stroke="#acbfdf"/><text x="29" y="87" font-size="19" fill="#25364e" font-weight="600" >Design</text><text x="29" y="111" font-size="13" fill="#788aa5" font-weight="400" >4 windows · 1 tab group</text><rect x="29" y="130" width="68" height="37" rx="5" fill="#b5d6f4" /><rect x="102" y="130" width="56" height="37" rx="5" fill="#d2dcf5" /><rect x="14" y="199" width="230" height="46" rx="12" fill="#ffffff" fill-opacity=".42" stroke="#d2def0"/><text x="29" y="228" font-size="16" fill="#6b809f" font-weight="400" >Reading</text></g><path class="open-path" d="M316 300H355M344 291L355 300L344 309" fill="none" stroke="#5b7fc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(372 145)"><rect x="0" y="0" width="700" height="320" rx="20" fill="url(#glass)" stroke="white" stroke-width="1.6"/><text x="22" y="29" font-size="15" fill="#50658a" font-weight="500" >Design</text><text x="676" y="29" font-size="12" fill="#7287a5" font-weight="400" text-anchor="end">Desktop</text><g transform="translate(18 49)"><g class="restore-main"><rect x="0" y="0" width="367" height="30" rx="9" fill="url(#window)" stroke="white"/><rect x="4" y="4" width="171" height="22" rx="6" fill="#ffffff" /><text x="18" y="20" font-size="12" fill="#37567e" font-weight="500" >Browser</text><text x="199" y="20" font-size="12" fill="#798daa" font-weight="400" >Notes</text><g transform="translate(0 37)"><rect x="0" y="0" width="367" height="213" rx="16" fill="url(#window)" stroke="#ffffff" stroke-width="1.8"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#60708b" font-weight="500" >Reference</text><path d="M1 44H366" stroke="#bac9e1" stroke-opacity=".55"/><text x="20" y="81" font-size="22" fill="#25364e" font-weight="600" >Start where you left off.</text><rect x="20" y="106" width="283" height="5" rx="2" fill="#becde1" /><rect x="20" y="127" width="246" height="5" rx="2" fill="#becde1" /><rect x="20" y="148" width="276" height="5" rx="2" fill="#becde1" /><rect x="20" y="169" width="182" height="5" rx="2" fill="#becde1" /></g></g></g><g transform="translate(401 49)"><g class="restore-side"><rect x="0" y="0" width="281" height="146" rx="16" fill="url(#window)" stroke="#ffffff" stroke-width="1.8"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#60708b" font-weight="500" >Files</text><path d="M1 44H280" stroke="#bac9e1" stroke-opacity=".55"/><rect x="16" y="58" width="16" height="12" rx="3" fill="#94bee9" /><text x="43" y="69" font-size="13" fill="#6b819d" font-weight="400" >Research</text><rect x="16" y="85" width="16" height="12" rx="3" fill="#94bee9" /><text x="43" y="96" font-size="13" fill="#6b819d" font-weight="400" >Sketches</text><rect x="16" y="112" width="16" height="12" rx="3" fill="#94bee9" /><text x="43" y="123" font-size="13" fill="#6b819d" font-weight="400" >References</text></g></g><g transform="translate(401 211)"><g class="restore-last"><rect x="0" y="0" width="281" height="88" rx="12" fill="url(#window)" stroke="white" stroke-width="1.4"/><text x="17" y="28" font-size="13" fill="#6c81a0" font-weight="500" >Terminal</text><text x="17" y="59" font-size="16" fill="#53807f" font-weight="400" >› ready</text></g></g></g><g transform="translate(48 512)"><rect x="0" y="0" width="134" height="46" rx="10" fill="#f8fbff" stroke="#ffffff" stroke-width="1.5"/><text x="67.0" y="30" font-size="21" fill="#25364e" font-weight="500" text-anchor="middle">right ⌘</text><rect x="143" y="0" width="52" height="46" rx="10" fill="#f8fbff" stroke="#ffffff" stroke-width="1.5"/><text x="169.0" y="30" font-size="21" fill="#25364e" font-weight="500" text-anchor="middle">W</text><rect x="204" y="0" width="52" height="46" rx="10" fill="#f8fbff" stroke="#ffffff" stroke-width="1.5"/><text x="230.0" y="30" font-size="21" fill="#25364e" font-weight="500" text-anchor="middle">1</text><text x="291" y="30" font-size="18" fill="#344e73" font-weight="500" >Open a workspace. Restore its layout.</text></g>
    <text x="1072" y="588" font-size="11" fill="#526886" font-weight="500" text-anchor="end" letter-spacing="1.4">TANGLER  /  ILLUSTRATED WALKTHROUGH</text>
  </g>
</svg>
