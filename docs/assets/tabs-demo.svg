<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Different apps. One tab group.</title>
  <desc id="desc">Clicking the Notes tab brings the notes window in front of the browser window within the same area. Illustrated walkthrough, not a screen recording.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#e4edfb"/><stop offset=".5" stop-color="#c2d9f3"/><stop offset="1" stop-color="#9b9edc"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f5ff"/><stop offset=".48" stop-color="#d5d9fb"/><stop offset="1" stop-color="#8296d4"/></linearGradient>
    <linearGradient id="fold" x2="1" y2="1"><stop stop-color="#b8cbf3"/><stop offset=".65" stop-color="#a0d7ef"/><stop offset="1" stop-color="#789dcf"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".91"/><stop offset="1" stop-color="#f5f8ff" stop-opacity=".82"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".67"/><stop offset="1" stop-color="#eef3ff" stop-opacity=".32"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#33477f" flood-opacity=".15"/></filter>
    <clipPath id="canvas"><rect width="1120" height="620" rx="28"/></clipPath>
    <symbol id="cursor" viewBox="0 0 24 30"><path d="M2 2L20 17L12 18L8 26Z" fill="#24354c" stroke="white" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .selected { animation:selection 10s ease-in-out infinite; }
    .browser { opacity:1; animation:browser 10s ease-in-out infinite; }
    .notes { opacity:0; animation:notes 10s ease-in-out infinite; }
    .pointer { transform:translate(544px,181px); animation:pointer 10s ease-in-out infinite; }
    .click { opacity:0; animation:click 10s ease-out infinite; }
    @keyframes selection { 0%,30%,100% { transform:translateX(0); } 38%,85% { transform:translateX(244px); } }
    @keyframes browser { 0%,30%,100% { opacity:1; } 38%,85% { opacity:0; } }
    @keyframes notes { 0%,30%,100% { opacity:0; } 38%,85% { opacity:1; } }
    @keyframes pointer { 0%,14%,92%,100% { transform:translate(620px,346px); opacity:0; } 23% { opacity:1; } 30%,80% { transform:translate(544px,181px); opacity:1; } }
    @keyframes click { 0%,30%,40%,100% { opacity:0; r:9px; } 32% { opacity:.8; r:9px; } 39% { opacity:0; r:25px; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pointer { display:none; } }
  </style>
  <g clip-path="url(#canvas)">
    <rect width="1120" height="620" fill="url(#sky)"/>
      <path d="M-190 596C130 642 468 122 1260 210L1300 680H-190Z" fill="url(#ribbon)" stroke="#edf7ff" stroke-width="2"/>
      <path d="M-110 637C244 443 746 776 1217 191L1290 690H-110Z" fill="url(#fold)" stroke="#f3f5ff" stroke-opacity=".8" stroke-width="1.6"/>
      <path d="M-190 590C130 636 468 116 1260 204" fill="none" stroke="#ffffff" stroke-opacity=".24" stroke-width="5"/>
    <text x="48" y="58" font-size="31" fill="#25364e" font-weight="650" >Different apps. One tab group.</text>
    <text x="48" y="90" font-size="18" fill="#61718b" font-weight="400" >Keep related windows together, then bring one to the front.</text>
    <g transform="translate(182 145)" filter="url(#shadow)"><rect x="0" y="0" width="756" height="58" rx="18" fill="url(#glass)" stroke="white" stroke-width="1.6"/><g class="selected"><rect x="9" y="8" width="235" height="42" rx="11" fill="#f9fbff" stroke="#ffffff"/></g><rect x="35" y="22" width="14" height="14" rx="3" fill="none" stroke="#607a9f" stroke-width="1.5"/><text x="60" y="36" font-size="17" fill="#2f496d" font-weight="500" >Browser</text><rect x="279" y="22" width="14" height="14" rx="3" fill="none" stroke="#607a9f" stroke-width="1.5"/><text x="304" y="36" font-size="17" fill="#2f496d" font-weight="500" >Notes</text><rect x="524" y="22" width="14" height="14" rx="3" fill="none" stroke="#607a9f" stroke-width="1.5"/><text x="549" y="36" font-size="17" fill="#2f496d" font-weight="500" >Files</text><g transform="translate(0 68)"><rect x="0" y="0" width="756" height="245" rx="16" fill="url(#window)" stroke="#ffffff" stroke-width="1.8"/><circle cx="20" cy="22" r="4" fill="#fc786e"/><circle cx="34" cy="22" r="4" fill="#efbe53"/><circle cx="48" cy="22" r="4" fill="#63c890"/><text x="68" y="28" font-size="14" fill="#60708b" font-weight="500" >Window in focus</text><path d="M1 44H755" stroke="#bac9e1" stroke-opacity=".55"/><g class="browser"><text x="32" y="87" font-size="25" fill="#25364e" font-weight="600" >Reference library</text><text x="32" y="115" font-size="16" fill="#667993" font-weight="400" >Articles, documentation, and a few open questions.</text><rect x="32" y="146" width="202" height="67" rx="9" fill="#e0eafa" stroke="#d4e0f1"/><rect x="46" y="163" width="150" height="5" rx="2" fill="#9db5d9" /><rect x="46" y="180" width="124" height="5" rx="2" fill="#bbcde5" /><rect x="254" y="146" width="218" height="67" rx="9" fill="#e0eafa" stroke="#d4e0f1"/><rect x="268" y="163" width="166" height="5" rx="2" fill="#9db5d9" /><rect x="268" y="180" width="140" height="5" rx="2" fill="#bbcde5" /><rect x="492" y="146" width="230" height="67" rx="9" fill="#e0eafa" stroke="#d4e0f1"/><rect x="506" y="163" width="178" height="5" rx="2" fill="#9db5d9" /><rect x="506" y="180" width="152" height="5" rx="2" fill="#bbcde5" /></g><g class="notes"><text x="32" y="87" font-size="25" fill="#25364e" font-weight="600" >Notes for today</text><rect x="34" y="110" width="15" height="15" rx="4" fill="none" stroke="#7691b7" stroke-width="1.3"/><text x="65" y="122" font-size="17" fill="#576c88" font-weight="400" >Bring the reference windows together</text><rect x="34" y="147" width="15" height="15" rx="4" fill="none" stroke="#7691b7" stroke-width="1.3"/><text x="65" y="159" font-size="17" fill="#576c88" font-weight="400" >Choose a tab to focus its app</text><rect x="34" y="184" width="15" height="15" rx="4" fill="none" stroke="#7691b7" stroke-width="1.3"/><text x="65" y="196" font-size="17" fill="#576c88" font-weight="400" >Keep the desktop in view</text></g></g></g><g class="pointer"><circle class="click" cx="0" cy="0" r="17" fill="none" stroke="#277ef3" stroke-width="2"/><use href="#cursor" width="24" height="30"/></g><g transform="translate(48 512)"><rect x="0" y="0" width="134" height="46" rx="10" fill="#f8fbff" stroke="#ffffff" stroke-width="1.5"/><text x="67.0" y="30" font-size="21" fill="#25364e" font-weight="500" text-anchor="middle">right ⌘</text><rect x="143" y="0" width="52" height="46" rx="10" fill="#f8fbff" stroke="#ffffff" stroke-width="1.5"/><text x="169.0" y="30" font-size="21" fill="#25364e" font-weight="500" text-anchor="middle">T</text><rect x="204" y="0" width="52" height="46" rx="10" fill="#f8fbff" stroke="#ffffff" stroke-width="1.5"/><text x="230.0" y="30" font-size="21" fill="#25364e" font-weight="500" text-anchor="middle">T</text><text x="291" y="30" font-size="18" fill="#344e73" font-weight="500" >Group windows. Click a tab to focus.</text></g>
    <text x="1072" y="588" font-size="11" fill="#526886" font-weight="500" text-anchor="end" letter-spacing="1.4">TANGLER  /  ILLUSTRATED WALKTHROUGH</text>
  </g>
</svg>
